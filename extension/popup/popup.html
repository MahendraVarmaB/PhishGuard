<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body {
            width: 300px; margin: 0; padding: 24px; font-family: 'Outfit', sans-serif;
            background: #0f172a; color: #f8fafc;
        }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .status-dot { width: 12px; height: 12px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }
        h2 { margin: 0; font-size: 20px; font-weight: 600; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase;}
        .value { font-size: 16px; font-weight: 600; color: #38bdf8;}
    </style>
</head>
<body>
    <div class="header">
        <div class="status-dot"></div>
        <h2>PhishGuard</h2>
    </div>
    <div class="card">
        <div class="label">System Status</div>
        <div class="value">Active & Protecting</div>
    </div>
    <div class="card">
        <div class="label">Backend API</div>
        <div class="value" id="api-status">Checking...</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
